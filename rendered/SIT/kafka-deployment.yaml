apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-kafka-app
  namespace: ns-payments-sit
  labels:
    app: payments-kafka-app
    segment: kafka
    managed-by: prebuild
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-kafka-app
  template:
    metadata:
      labels:
        app: payments-kafka-app
        segment: kafka
    spec:
      containers:
        - name: tibco-bw
          image: tibco/bwce:latest
          # --- Pod resources (resolved from performance.yaml by App size) ---
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          env:
            # --- Heap memory (JVM) ---
            - name: JAVA_OPTS
              value: "-Xms1024m -Xmx1024m"
          # ConfigMap supplies the EMS/Kafka tuning (max sessions, flow limit).
          envFrom:
            - configMapRef:
                name: payments-interface-config
