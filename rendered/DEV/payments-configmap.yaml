apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-interface-config
  namespace: ns-payments-dev
  labels:
    app: tibco-bw
    managed-by: prebuild
data:
  # --- Interface identity (from the UI) ---
  INTERFACE_ID: "2222"
  SCENARIO_ID: "2233"
  INTERFACE_LEANIX_URL: "https://adidas.leanix.net/adidasProduction/factsheet/Interface/2222"
  ENVIRONMENT: "DEV"

  # --- Source system (resolved from metadata.sources) ---
  SOURCE_SYSTEM: "afs"
  SOURCE_HOST: "${source.host}"
  SOURCE_PORT: "${source.port}"
  SOURCE_USER: "${source.user}"

  # --- Target system (resolved from metadata.targets) ---
  TARGET_SYSTEM: "wms"
  TARGET_JDBC_URL: "${target.jdbcUrl}"
  TARGET_HOST: "${target.host}"

  # --- TIBCO EMS (resolved by namespace) ---
  EMS_SERVER_URL: "tcp://ems-payments.dev.internal:7222"
  EMS_USER: "ems_payments"
  EMS_SSL_ENABLED: "false"

  # --- Kafka (resolved by environment) ---
  KAFKA_BOOTSTRAP_SERVERS: "kafka-dev-1:9092,kafka-dev-2:9092"
  KAFKA_SCHEMA_REGISTRY: "http://schema-registry.dev.internal:8081"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"

  # --- Performance tuning (resolved from performance.yaml by App size) ---
  EMS_MAX_SESSIONS: "100"
  EMS_FLOW_LIMIT: "512MB"
  KAFKA_MAX_SESSIONS: "25"
  KAFKA_FLOW_LIMIT: "5000"
